  <style>
    html, body { margin: 0; background: #fff; }

    #startup { --loader-teal: #087f6b; --loader-blue: #3158c9; --loader-speed: 2.7s; font-family: Arial, sans-serif; color: #111827; width: 100%; }
    #startup * { box-sizing: border-box; }
    #startup .loading-page { background: #fff; border: 1px solid #dce3ec; border-radius: 16px; overflow: hidden; }
    #startup .page-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 28px; border-bottom: 1px solid #edf0f5; }
    #startup .identity { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
    #startup .mini-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: #e8f5f1; color: var(--loader-teal); font-size: 12px; }
    #startup .center-stage { min-height: 448px; padding: 42px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    #startup .orbit { position: relative; width: 212px; height: 212px; display: grid; place-items: center; margin-bottom: 34px; }
    #startup .ring-guide { position: absolute; inset: 0; border-radius: 50%; border: 1px solid #e6eeef; }
    #startup .inner-guide { inset: 24px; border-color: #e7ebf6; }
    #startup .ring { position: absolute; inset: 0; border: 2px solid transparent; border-top-color: var(--loader-teal); border-right-color: var(--loader-teal); border-radius: 50%; animation: outline-orbit var(--loader-speed) linear infinite; }
    #startup .ring::after { content: ''; position: absolute; top: 27px; right: 25px; width: 9px; height: 9px; background: var(--loader-teal); border-radius: 50%; box-shadow: 0 0 0 5px #087f6b0b; }
    #startup .inner-ring { inset: 24px; border-top-color: var(--loader-blue); border-right-color: transparent; border-bottom-color: var(--loader-blue); animation-direction: reverse; animation-duration: calc(var(--loader-speed) * 1.4); }
    #startup .inner-ring::after { top: 18px; right: 18px; width: 7px; height: 7px; background: var(--loader-blue); box-shadow: none; }
    #startup .monogram { width: 100px; height: 100px; display: grid; place-items: center; border-radius: 28px; background: #f0f8f5; color: var(--loader-teal); font-size: 40px; letter-spacing: -2px; font-weight: 500; animation: outline-pulse 2.4s ease-in-out infinite; }
    #startup .loading-title { margin: 0; font-size: 25px; line-height: 1.3; font-weight: 500; letter-spacing: -0.6px; }
    #startup .loading-dots { display: inline-flex; gap: 4px; margin-left: 7px; vertical-align: middle; }
    #startup .loading-dots i { display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--loader-teal); animation: outline-dot 1.4s ease-in-out infinite; }
    #startup .loading-dots i:nth-child(2) { animation-delay: 160ms; }
    #startup .loading-dots i:nth-child(3) { animation-delay: 320ms; }
    #startup .subtitle { margin: 12px 0 0; color: #637083; font-size: 14px; line-height: 1.6; }
    #startup .page-footer { padding: 20px 28px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid #edf0f5; color: #637083; font-size: 12px; }
    @keyframes outline-orbit { to { transform: rotate(360deg); } }
    @keyframes outline-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.055); } }
    @keyframes outline-dot { 0%, 75%, 100% { transform: translateY(0); opacity: 0.35; } 35% { transform: translateY(-4px); opacity: 1; } }
    @media (max-width: 420px) {
      #startup .page-header { padding: 18px; }
      #startup .identity { font-size: 13px; }
      #startup .center-stage { min-height: 426px; }
      #startup .loading-title { font-size: 23px; }
      #startup .page-footer { padding: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #startup .ring, #startup .monogram, #startup .loading-dots i { animation: none; }
    }

    #startup { position: fixed; inset: 0; z-index: 2147483647; overflow: auto; background: #fff; transition: opacity 240ms ease-out; }
    #startup .loading-page { display: flex; flex-direction: column; min-height: 100%; border: none; border-radius: 0; overflow: visible; }
    #startup .page-header, #startup .page-footer, #startup .startup-links { flex-shrink: 0; }
    #startup .center-stage { flex: 1 0 auto; min-height: 370px; padding: 28px 20px; }
    #startup .status { max-width: 520px; }
    #startup .loading-title { font-size: clamp(1.5rem, 3vw, 1.875rem); }
    #startup .subtitle, #startup .startup-links { font-size: 0.875rem; }
    #startup .startup-links { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px 20px; padding: 6px 20px 14px; }
    #startup a { color: #3158c9; text-underline-offset: 4px; }
    #startup a:focus-visible { outline: 3px solid #3158c9; outline-offset: 4px; }
    #startup .startup-links a { display: inline-flex; align-items: center; min-height: 44px; }
    #startup .retry { display: inline-block; padding: 12px 22px; margin-top: 18px; border-radius: 12px; color: #fff; background: #087f6b; text-decoration: none; font-size: 0.875rem; }
    #startup.has-loading-error .ring, #startup.has-loading-error .monogram, #startup.has-loading-error .loading-dots i { animation: none; }
    #startup.has-loading-error .loading-dots { display: none; }
    #startup.leaving { opacity: 0; pointer-events: none; }
    #startup [hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { #startup { transition: none; } }

  <!-- CSS-only full-screen loader: no additional animation asset downloads. -->
  <div id="startup">
    <section class="loading-page" aria-label="Portfolio loading screen">
    <header class="page-header">
      <div class="identity"><span class="mini-mark" aria-hidden="true">SM</span>Sidratul Montaha</div>
    </header>
    <main class="center-stage">
      <div class="orbit" aria-hidden="true">
        <div class="ring-guide"></div>
        <div class="ring-guide inner-guide"></div>
        <div class="ring"></div>
        <div class="ring inner-ring"></div>
        <div class="monogram">SM</div>
      </div>
      <div class="status" role="status" aria-live="polite" aria-atomic="true">
        <h1 class="loading-title"><span id="startup-title">Loading my portfolio</span><span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></h1>
        <p id="startup-status" class="subtitle">Getting everything ready for you</p>
      </div>
      <a id="startup-retry" class="retry" href="" hidden>Try again</a>
      <noscript>
        <style>#startup .orbit, #startup .status { display: none; }</style>
        <h1>Sidratul Montaha — Flutter Software Engineer</h1>
        <p class="subtitle">Enable JavaScript to explore my Android, iOS, Bluetooth and IoT work. My CV and contact links below are available now.</p>
      </noscript>
    </main>
    <nav class="startup-links" aria-label="Portfolio links available while loading">
          <a href="https://drive.google.com/file/d/1TYH92znM8dSZ3sKT0-bnlcENmEEHdIwg/view?usp=sharing" target="_blank" rel="noopener">Download CV</a>
          <a href="mailto:sonykhan1121@gmail.com">Contact me</a>
          <a href="https://github.com/Sonykhan1121" target="_blank" rel="noopener">GitHub</a>
          <a href="https://www.linkedin.com/in/sidratul-montaha-flutter/" target="_blank" rel="noopener">LinkedIn</a>
    </nav>
    <footer class="page-footer"><span>Flutter software engineer</span><span>Android · iOS · Connected devices</span></footer>
  </section>
  </div>
  <script>
    (() => {
      const shell = document.getElementById('startup');
      let ready = false;
      let failed = false;
      window.portfolioStartupStage = (message) => {
        if (ready || failed) return;
        document.getElementById('startup-status').textContent = message;
      };
      window.portfolioStartupFailed = () => {
        if (ready) return;
        failed = true;
        shell.classList.add('has-loading-error');
        document.getElementById('startup-title').textContent = 'Taking a little longer';
        document.getElementById('startup-status').textContent = 'The interactive view is taking longer than expected. My CV and contact links are available below.';
        document.getElementById('startup-retry').hidden = false;
      };
      const timeout = setTimeout(window.portfolioStartupFailed, 35000);
      window.addEventListener('error', (event) => {
        if (event.target instanceof HTMLScriptElement) window.portfolioStartupFailed();
      }, true);
      window.addEventListener('flutter-first-frame', () => {
        ready = true;
        document.getElementById('startup-title').textContent = 'Welcome';
        document.getElementById('startup-status').textContent = 'Your portfolio is ready';
        clearTimeout(timeout);
        // Reveal the actual first frame without waiting for every full-size image.
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const restoreFocus = shell.contains(document.activeElement);
          shell.setAttribute('aria-hidden', 'true');
          shell.inert = true;
          shell.classList.add('leaving');
          if (restoreFocus) {
            const view = document.querySelector('flutter-view');
            if (view) { view.setAttribute('tabindex', '-1'); view.focus({preventScroll: true}); }
          }
          setTimeout(() => shell.remove(), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 260);
        }));
      }, {once: true});
    })();
  </script>
